<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0e14"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#1e293b" stroke-width="6"/>

  <!-- Subtle pitch grid lines -->
  <line x1="56" y1="176" x2="456" y2="176" stroke="#1e293b" stroke-width="3" stroke-dasharray="10 10"/>
  <line x1="56" y1="256" x2="456" y2="256" stroke="#0e7490" stroke-width="4" opacity="0.55"/>
  <line x1="56" y1="336" x2="456" y2="336" stroke="#1e293b" stroke-width="3" stroke-dasharray="10 10"/>

  <!-- Pitch wave curve -->
  <path d="M 64 290 C 115 290, 125 210, 165 210 C 195 210, 200 256, 225 256" fill="none" stroke="#22d3ee" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M 287 256 C 315 256, 330 220, 365 220 C 400 220, 415 256, 448 256" fill="none" stroke="#10b981" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Microphone Capsule -->
  <rect x="220" y="132" width="72" height="132" rx="36" fill="url(#accentGrad)"/>
  <!-- Mic grille slits -->
  <line x1="238" y1="172" x2="274" y2="172" stroke="#0b0e14" stroke-width="6" stroke-linecap="round"/>
  <line x1="238" y1="196" x2="274" y2="196" stroke="#0b0e14" stroke-width="6" stroke-linecap="round"/>
  <line x1="238" y1="220" x2="274" y2="220" stroke="#0b0e14" stroke-width="6" stroke-linecap="round"/>

  <!-- Mic Stand U-cradle -->
  <path d="M 194 224 A 62 62 0 0 0 318 224" fill="none" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="286" x2="256" y2="354" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>
  <line x1="212" y1="354" x2="300" y2="354" stroke="#f8fafc" stroke-width="14" stroke-linecap="round"/>

  <!-- Live pitch indicator dot -->
  <circle cx="448" cy="256" r="14" fill="#10b981" filter="url(#glow)"/>
  <circle cx="448" cy="256" r="6" fill="#ffffff"/>
</svg>
